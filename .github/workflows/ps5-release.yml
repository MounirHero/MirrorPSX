name: Release

on:
  push:
    tags: ['v*']
  schedule:
    # Select the 22:00 Europe/Rome slot in preflight, accounting for DST.
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0 or v0.1.0 (blank uses VERSION)
        type: string
        required: false
      nightly:
        description: Build an immutable historical nightly release
        type: boolean
        default: false
      draft:
        description: Create the GitHub release as draft
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub release as prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ps5-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve release identity
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.identity.outputs.should_run }}
      nightly: ${{ steps.identity.outputs.nightly }}
      version: ${{ steps.identity.outputs.version }}
      native_version: ${{ steps.identity.outputs.native_version }}
      tag: ${{ steps.identity.outputs.tag }}
      title: ${{ steps.identity.outputs.title }}
      stable: ${{ steps.identity.outputs.stable }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release identity and Rome schedule
        id: identity
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NIGHTLY: ${{ inputs.nightly }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          SCHEDULE: ${{ github.event.schedule }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
          args=(--event "$GITHUB_EVENT_NAME" --ref-name "$GITHUB_REF_NAME"
                --version "$INPUT_VERSION" --sha "$GITHUB_SHA"
                --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" --schedule "$SCHEDULE")
          if [ "$INPUT_NIGHTLY" = true ]; then args+=(--nightly); fi
          if [ "$INPUT_DRAFT" = true ]; then args+=(--draft); fi
          if [ "$INPUT_PRERELEASE" = true ]; then args+=(--prerelease); fi
          python3 tools/resolve-release.py "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  verify:
    name: Verify before native release
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    uses: ./.github/workflows/verify.yml

  build:
    # Preflight requires a trusted default-branch commit, including tag releases.
    needs: [preflight, verify]
    runs-on: ubuntu-24.04
    environment:
      name: main
      deployment: false
    timeout-minutes: 180
    env:
      OPENPROSPERO_SDK: ${{ github.workspace }}/_deps/sdk/sdk
      OPENPROSPERO_CLANG: clang-19
      OPENPROSPERO_LLD: /usr/bin/ld.lld-19
      OPENPROSPERO_AR: llvm-ar-19
      OPENPROSPERO_STRIP: llvm-strip-19
      MIRROR_PLATFORM_SOURCE: ${{ github.workspace }}/_deps/platform
      MIRROR_MESA_SOURCE: ${{ github.workspace }}/_deps/mesa
      MIRROR_RADV_ARCHIVE: ${{ github.workspace }}/_deps/sdk/build/ps5-mesa/release/lib/libvulkan_radeon.a
      LLVM_CONFIG: llvm-config-19
      RELEASE_VERSION: ${{ needs.preflight.outputs.native_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check release configuration
        env:
          SDK_READ_TOKEN: ${{ secrets.OPENPROSPERO_READ_TOKEN }}
          BROKER_TOKEN: ${{ secrets.MIRROR_BROKER_TOKEN }}
          SDK_REF: ${{ vars.OPENPROSPERO_REF }}
        run: |
          python3 - <<'PY'
          import os, re
          required = ('SDK_READ_TOKEN', 'BROKER_TOKEN')
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Configure SDK read token and shared broker token as secrets in the main environment')
          if os.environ.get('SDK_REF') and not re.fullmatch(r'[a-fA-F0-9]{40}', os.environ['SDK_REF']):
              raise SystemExit('OPENPROSPERO_REF must be a full immutable commit SHA')
          if not re.fullmatch(r'[0-9]{2}\.[0-9]{2}', os.environ['RELEASE_VERSION']):
              raise SystemExit('Version must use NN.NN')
          token = os.environ['BROKER_TOKEN']
          if not re.fullmatch(r'[a-fA-F0-9]{8}', token) or int(token, 16) == 0:
              raise SystemExit('Shared broker token must be eight hexadecimal digits with a nonzero value')
          PY

      - name: Import private OpenProspero SDK
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.OPENPROSPERO_REPOSITORY || 'OpenProspero/sdk' }}
          ref: ${{ vars.OPENPROSPERO_REF }}
          token: ${{ secrets.OPENPROSPERO_READ_TOKEN }}
          path: _deps/sdk
          submodules: recursive
          lfs: true
          persist-credentials: false

      - name: Record resolved SDK commit
        run: |
          SDK_COMMIT=$(git -C _deps/sdk rev-parse HEAD)
          echo "OpenProspero commit: $SDK_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "OPENPROSPERO_RESOLVED_COMMIT=$SDK_COMMIT" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config clang-19 clang-tools-19 lld-19 llvm-19-dev libclang-rt-19-dev \
            libclang-19-dev libclc-19-dev libclc-19 libllvmspirvlib-19-dev spirv-tools \
            glslang-tools zlib1g-dev libssl-dev libpng-dev libdrm-dev libexpat1-dev \
            bison flex libzstd-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxfixes-dev libxrender-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev
          python3 -m venv "$RUNNER_TEMP/mirror-python"
          "$RUNNER_TEMP/mirror-python/bin/pip" install pillow pyyaml tzdata meson ninja mako packaging
          echo "$RUNNER_TEMP/mirror-python/bin" >> "$GITHUB_PATH"
          echo /usr/lib/llvm-19/bin >> "$GITHUB_PATH"
          "$OPENPROSPERO_LLD" --version

      - name: Fetch pinned public build inputs
        run: |
          python tests/documentation_test.py
          python tests/ci_config_test.py
          python tools/ci-bootstrap.py

      - name: Build private SDK host tools
        run: |
          cmake -S _deps/sdk -B _deps/sdk/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 \
            -DOP_ENABLE_PACKAGING=ON -DOP_BUILD_GUI=OFF -DOP_BUILD_TESTS=OFF -DOP_BUILD_EXAMPLES=OFF
          cmake --build _deps/sdk/build --target prospero prospero-link prospero-stub -j2
          echo "$GITHUB_WORKSPACE/_deps/sdk/build/bin" >> "$GITHUB_PATH"

      - name: Build native RADV
        env:
          PS5_MESA_SOURCE: ${{ github.workspace }}/_deps/mesa
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: sh _deps/sdk/tools/build-ps5-mesa.sh release

      - name: Build shared external companion
        shell: pwsh
        env:
          MIRROR_BROKER_TOKEN: ${{ secrets.MIRROR_BROKER_TOKEN }}
        run: ./tools/build-shared-broker.ps1 -SdkRoot _deps/sdk

      - name: Build native title and runtime
        run: |
          bash tools/build-ps5.sh
          bash tools/build-ps5-runtime.sh

      - name: Test release exporter
        run: python tests/ps5_release_test.py

      - name: Package PKG and folder ZIP
        shell: pwsh
        run: |
          ./tools/package-ps5.ps1 -SdkRoot _deps/sdk -Version $env:RELEASE_VERSION `
            -ProsperoPath _deps/sdk/build/bin/prospero

      - name: Upload reviewed release set only
        uses: actions/upload-artifact@v7
        with:
          name: MirrorPSX-PS5-${{ needs.preflight.outputs.tag }}
          path: dist/ps5-v${{ needs.preflight.outputs.native_version }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    environment:
      name: main
      deployment: false
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_TITLE: ${{ needs.preflight.outputs.title }}
      RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      INPUT_DRAFT: ${{ inputs.draft }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified release set
        uses: actions/download-artifact@v8
        with:
          name: MirrorPSX-PS5-${{ needs.preflight.outputs.tag }}
          path: release-assets
      - name: Download tested Windows preview
        uses: actions/download-artifact@v8
        with:
          name: MirrorPSX-Windows-preview-${{ github.sha }}
          path: windows-preview
      - name: Package Windows preview
        run: |
          python3 - <<'PY'
          import shutil
          shutil.make_archive('release-assets/MirrorPSX-Windows-preview', 'zip', 'windows-preview')
          PY
          cd release-assets
          sha256sum MirrorPSX-Windows-preview.zip >> SHA256SUMS.txt
      - name: Verify checksums and create selected release
        run: |
          cd release-assets
          sha256sum --strict -c SHA256SUMS.txt
          tag="$RELEASE_TAG"
          # Refuse existing releases and tags pointing at a different commit.
          # Authentication/network errors must fail rather than look like a missing tag.
          python3 - <<'PY'
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GH_REPO']
          tag = os.environ['RELEASE_TAG']
          def get(path):
              request = Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  import json
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  return None
          if get('/releases/tags/' + tag) is not None:
              raise SystemExit('Release already exists; published snapshots are immutable')
          ref = get('/git/ref/tags/' + tag)
          if ref is not None:
              obj = ref['object']
              for _ in range(5):
                  if obj['type'] != 'tag':
                      break
                  obj = get('/git/tags/' + obj['sha'])['object']
              if obj['type'] != 'commit' or obj['sha'] != os.environ['GITHUB_SHA']:
                  raise SystemExit('Tag points at a different commit')
          PY
          printf '%s\n' \
            'Experimental PS5 build. Choose PKG or folder ZIP; use the matching external shared companion.' \
            'The Windows receiver is provided as a separate preview ZIP.' \
            'See INSTALL.txt and the repository README. Hardware verification remains separate from CI checks.' \
            "Built from $GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/release-notes.md"
          flags=(--generate-notes)
          if [ "$INPUT_DRAFT" = true ]; then
            flags+=(--draft --latest=false)
          elif [ "$RELEASE_PRERELEASE" = true ]; then
            flags+=(--latest=false)
          else
            flags+=(--latest=true)
          fi
          if [ "$RELEASE_PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" ./* "${flags[@]}" \
            --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          printf 'Created release: [%s](%s/%s/releases/tag/%s)\n' \
            "$tag" "$GITHUB_SERVER_URL" "$GH_REPO" "$tag" >> "$GITHUB_STEP_SUMMARY"
